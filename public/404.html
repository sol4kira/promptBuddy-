<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex">
  <meta name="description" content="PromptBuddy - Page Not Found (404)" />
  <meta name="theme-color" content="#0f1614" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <title>404 - Page Not Found | PromptBuddy</title>
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="header-inner">
      <a href="/" class="brand-logo" aria-label="PromptBuddy Home">
        <svg class="leaf-icon" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M26.2 4.1C18.8 4.7 6.5 11.2 6.5 21.8c0 4.2 3.3 6.1 6.5 6.1 7.8 0 13.8-9.4 13.8-18.4 0-1.1-.1-2.1-.3-2.9-.6-.9-1.5-1.5-2.5-2.1-1.1-.3-2.4-.4-3.8-.4z" fill="#34d399"/>
          <path d="M21 23c-3.5 0-6.8-2.5-7.4-6.8 4.3-1.1 9.4-4.2 11.3-8.8-.4 6.7-1.8 15.6-3.9 15.6z" fill="#10b981" opacity="0.6"/>
        </svg>
        <span class="brand-text">PromptBuddy</span>
      </a>

      <nav class="desktop-nav" aria-label="Main Navigation">
        <a href="/" class="nav-item">Home</a>
      </nav>
    </div>
  </header>

  <!-- Main 404 Card -->
  <main class="not-found-wrapper">
    <section class="not-found-card">
      <div class="not-found-code">404 ERROR</div>
      <svg class="not-found-leaf" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M26.2 4.1C18.8 4.7 6.5 11.2 6.5 21.8c0 4.2 3.3 6.1 6.5 6.1 7.8 0 13.8-9.4 13.8-18.4 0-1.1-.1-2.1-.3-2.9-.6-.9-1.5-1.5-2.5-2.1-1.1-.3-2.4-.4-3.8-.4z" fill="#34d399"/>
        <path d="M21 23c-3.5 0-6.8-2.5-7.4-6.8 4.3-1.1 9.4-4.2 11.3-8.8-.4 6.7-1.8 15.6-3.9 15.6z" fill="#10b981" opacity="0.6"/>
      </svg>
      <h1 class="not-found-title">Page Not Found</h1>
      <p class="not-found-subtitle">
        Looks like this page got lost in transit. The link might be outdated or the page has been moved.
      </p>
      <a href="/" class="not-found-action">
        <span>Back to PromptBuddy</span>
        <span class="btn-arrow">→</span>
      </a>
    </section>
  </main>

  <!-- Footer -->
  <footer class="app-footer" style="display:block;">
    <div class="footer-container">
      <div class="footer-bottom" style="border-top:none; padding-top:0;">
        <p class="footer-copyright">
          &copy; <span id="footerYear">2026</span> Kirubel Solomon. All rights reserved.
        </p>
        <div class="footer-bottom-badge">
          <span>Designed &amp; Built by Kirubel Solomon</span>
        </div>
      </div>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
